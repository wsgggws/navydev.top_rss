name: CI

on: [push, pull_request]

# on:
#   push:
#     branches:
#       - main
#   pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: 🔄 Checkout code
        uses: actions/checkout@v7

      - name: 🛠️ Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🧪 Build project
        run: npm run build
